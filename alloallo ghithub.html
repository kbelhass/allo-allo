<title>Allo-Allo — Retrouve ton bled, où que tu sois</title>

            dim: '#b02f34',

        },

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; background: #05070c; }
  body {
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .font-display { font-family: 'Cairo', sans-serif; }

  ::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; -ms-overflow-style: none; }

  /* Desktop phone-frame chrome */
  #device-frame {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    max-height: 932px;
    position: relative;
    background: #0b0f19;
    overflow: hidden;
  }
  @media (min-width: 640px) {
    #device-frame {
      height: 900px;
      border-radius: 44px;
      border: 10px solid #05070c;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 40px 90px -30px rgba(0,0,0,0.9);
    }
  }

  /* Zellige-inspired geometric texture, used once on onboarding hero */
  .zellige-bg {
    background-image:
      linear-gradient(rgba(226,62,68,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(226,62,68,0.045) 1px, transparent 1px),
      radial-gradient(circle at 50% 50%, rgba(226,62,68,0.06) 0, transparent 2px);
    background-size: 42px 42px, 42px 42px, 42px 42px;
    background-position: center;
  }

  /* ---------------------------------------------------------
     LANDING PAGE THEME TOKENS
     Dark is the brand default (matches the in-app palette).
     Light swaps the surface for a warm plaster tone instead
     of a generic template cream, keeping the Carthage red /
     gold accents that already belong to this product.
  --------------------------------------------------------- */
  #landing-root {
    --bg: #0b0f19;
    --bg-soft: #05070c;
    --surface: #111827;
    --surface-2: #0f1522;
    --text: #f5f3ef;
    --muted: rgba(245,243,239,0.62);
    --muted-2: rgba(245,243,239,0.38);
    --border: rgba(255,255,255,0.10);
    --hairline: rgba(255,255,255,0.14);
    color-scheme: dark;
    background: var(--bg);
    color: var(--text);
  }
  #landing-root.theme-light {
    --bg: #F5EEDD;
    --bg-soft: #EFE6CF;
    --surface: #FFFFFF;
    --surface-2: #FBF6E8;
    --text: #221c11;
    --muted: rgba(34,28,17,0.64);
    --muted-2: rgba(34,28,17,0.42);
    --border: rgba(34,28,17,0.12);
    --hairline: rgba(34,28,17,0.14);
    color-scheme: light;
  }
  #landing-root.theme-light .zellige-bg {
    background-image:
      linear-gradient(rgba(226,62,68,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(226,62,68,0.07) 1px, transparent 1px),
      radial-gradient(circle at 50% 50%, rgba(226,62,68,0.09) 0, transparent 2px);
  }

  /* Mini hero phone, decorative only */
  #hero-preview-frame {
    width: 100%;
    max-width: 300px;
    aspect-ratio: 9 / 18.5;
    border-radius: 34px;
    border: 8px solid #05070c;
    background: #0b0f19;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 40px 80px -25px rgba(0,0,0,0.75);
    overflow: hidden;
    position: relative;
  }

  /* Card stack transitions */
  .card-leave-right { animation: leaveRight .38s ease-in forwards; }
  .card-leave-left { animation: leaveLeft .38s ease-in forwards; }
  .card-leave-down { animation: leaveDown .3s ease-in forwards; }
  @keyframes leaveRight {
    to { transform: translate(140%, -20px) rotate(22deg); opacity: 0; }
  }
  @keyframes leaveLeft {
    to { transform: translate(-140%, -20px) rotate(-22deg); opacity: 0; }
  }
  @keyframes leaveDown {
    to { transform: translate(0, 60px) scale(0.92); opacity: 0; }
  }
  .card-enter { animation: cardEnter .32s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes cardEnter {
    from { transform: scale(0.93) translateY(14px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .stamp {
    border: 3px solid;
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    letter-spacing: 0.04em;
    transform: rotate(-10deg);
    padding: 4px 14px;
  }

  .live-dot {
    box-shadow: 0 0 0 0 rgba(226,62,68,0.7);
    animation: livePulse 1.6s infinite;
  }
  @keyframes livePulse {
    0% { box-shadow: 0 0 0 0 rgba(226,62,68,0.65); }
    70% { box-shadow: 0 0 0 10px rgba(226,62,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(226,62,68,0); }
  }
  .live-ring {
    animation: ringGrow 2.2s ease-out infinite;
  }
  @keyframes ringGrow {
    0% { transform: scale(0.9); opacity: 0.55; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  /* Match popup */
  .match-overlay { animation: fadeIn .25s ease-out both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .match-avatar-left { animation: avatarInLeft .55s cubic-bezier(.2,.7,.3,1.2) both; }
  .match-avatar-right { animation: avatarInRight .55s cubic-bezier(.2,.7,.3,1.2) both; }
  @keyframes avatarInLeft { from { transform: translateX(-90px) rotate(-12deg); opacity:0; } to { transform: translateX(0) rotate(-6deg); opacity:1; } }
  @keyframes avatarInRight { from { transform: translateX(90px) rotate(12deg); opacity:0; } to { transform: translateX(0) rotate(6deg); opacity:1; } }
  .match-heading { animation: headingPop .5s .25s cubic-bezier(.2,.8,.3,1.1) both; }
  @keyframes headingPop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Toast */
  .toast-in { animation: toastIn .28s ease-out both; }
  .toast-out { animation: toastOut .25s ease-in forwards; }
  @keyframes toastIn { from { transform: translateY(-14px); opacity: 0;} to { transform: translateY(0); opacity: 1;} }
  @keyframes toastOut { to { transform: translateY(-14px); opacity: 0;} }

  /* Chat bubble entrance */
  .bubble-in { animation: bubbleIn .22s ease-out both; }
  @keyframes bubbleIn { from { transform: translateY(6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .typing-dot { animation: typingBounce 1s infinite; }
  .typing-dot:nth-child(2) { animation-delay: .15s; }
  .typing-dot:nth-child(3) { animation-delay: .3s; }
  @keyframes typingBounce { 0%,60%,100% { transform: translateY(0); opacity: .5;} 30% { transform: translateY(-4px); opacity: 1; } }

  .admin-slide { animation: adminSlide .3s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes adminSlide { from { transform: translateY(100%);} to { transform: translateY(0);} }

  /* Floating hearts on Like */
  .floating-heart {
    position: absolute;
    bottom: 90px;
    font-size: 22px;
    animation: floatUp 1.1s ease-out forwards;
    pointer-events: none;
    z-index: 40;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-220px) scale(1.15) rotate(var(--rot, 12deg)); opacity: 0; }
  }

  .hero-glow {
    background: radial-gradient(circle, rgba(226,62,68,0.35) 0%, rgba(226,62,68,0) 70%);
    filter: blur(10px);
  }

  input:focus, textarea:focus, button:focus-visible {
    outline: 2px solid rgba(226,62,68,0.6);
    outline-offset: 2px;
  }
  input[type="text"]:focus, select:focus { outline-offset: 0; }
</style>
</head>

/* =========================================================
   Persistence (localStorage) — profile, premium status,
   matches, messages, admin pricing and theme survive a page
   reload. Photos/videos and the public feed stay in memory
   only, to stay well under the localStorage size limit.
   ========================================================= */

function saveState() {
  try {
    const toSave = {
      user: {
        pseudo: state.user.pseudo,
        country: state.user.country,
        city: state.user.city,
        premium: state.user.premium,
        email: state.user.email,
        adminVerified: state.user.adminVerified,
      },
      hasOnboarded: state.hasOnboarded,
      matches: state.matches,
      messages: state.messages,
      unread: state.unread,
      blocklist: state.blocklist,
      suspended: state.suspended,
      liveOverrides: state.liveOverrides,
      pricing: state.pricing,
      theme: state.theme,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch (e) {
    /* localStorage indisponible ou plein : on continue sans bloquer l'app */
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.user) {
      state.user.pseudo = saved.user.pseudo || '';
      state.user.country = saved.user.country || '';
      state.user.city = saved.user.city || '';
      state.user.premium = saved.user.premium || null;
      state.user.email = saved.user.email || '';
      state.user.adminVerified = !!saved.user.adminVerified;
    }
    state.hasOnboarded = !!saved.hasOnboarded;
    state.matches = Array.isArray(saved.matches) ? saved.matches : [];
    state.messages = saved.messages || {};
    state.unread = saved.unread || {};
    state.blocklist = Array.isArray(saved.blocklist) ? saved.blocklist : [];
    state.suspended = Array.isArray(saved.suspended) ? saved.suspended : [];
    state.liveOverrides = saved.liveOverrides || {};
    if (saved.pricing) state.pricing = saved.pricing;
    state.theme = saved.theme === 'light' ? 'light' : 'dark';
  } catch (e) {
    /* données corrompues : on repart d'un état propre */
  }
}

/* =========================================================
   Helpers
   ========================================================= */

const $root = document.getElementById('app-root');
const $toasts = document.getElementById('toast-root');
const $landing = document.getElementById('landing-root');
const $shell = document.getElementById('app-shell');

function icons() {
  if (window.lucide) lucide.createIcons();
}

function withPreservedFocus(mutate) {
  const active = document.activeElement;
  const id = active && active.id;
  const start = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const end = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
  mutate();
  if (id) {
    const el = document.getElementById(id);
    if (el) {
      el.focus();
      if (start !== null && el.setSelectionRange) {
        try { el.setSelectionRange(start, end); } catch (e) {}
      }
    }
  }
}

function showToast(message, opts = {}) {
  const { icon = 'info', tone = 'default', duration = 2400 } = opts;
  const toneClasses = {
    default: 'bg-card border-white/10 text-white',
    danger: 'bg-carthage/95 border-carthage/40 text-white',
    success: 'bg-emerald-600/95 border-emerald-400/30 text-white',
  }[tone];
  const el = document.createElement('div');
  el.className = `toast-in pointer-events-auto max-w-[92%] shadow-soft border rounded-2xl px-4 py-3 flex items-center gap-2.5 text-sm font-medium ${toneClasses}`;
  el.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i><span>${message}</span>`;
  $toasts.appendChild(el);
  icons();
  setTimeout(() => {
    el.classList.remove('toast-in');
    el.classList.add('toast-out');
    setTimeout(() => el.remove(), 260);
  }, duration);
}

function profileById(id) {
  return PROFILES.find(p => p.id === id);
}

function totalUnread() {
  return Object.values(state.unread).reduce((a, b) => a + b, 0);
}

function initials(name) {
  return name.slice(0, 1).toUpperCase();
}

function isProfileLive(id) {
  const p = profileById(id);
  if (!p) return false;
  return state.liveOverrides[id] !== undefined ? state.liveOverrides[id] : p.isLive;
}

function canWatchLiveFree(id) {
  return isAdminUser() || !!state.user.premium || state.unlockedLives.includes(id);
}

function isSuspended(id) {
  return state.suspended.includes(id);
}

const ADMIN_PSEUDO = 'belhassen karim';
function isAdminUser() {
  return state.user.pseudo.trim().toLowerCase() === ADMIN_PSEUDO && !!state.user.adminVerified;
}

function isAbroad() {
  return !!state.user.country && state.user.country !== 'Tunisie';
}

function formatTND(n) {
  return `${Number(n).toFixed(3).replace('.', ',')} DT`;
}

function formatEUR(n) {
  return `${Number(n).toFixed(2).replace('.', ',')} €`;
}

    switch (state.screen) {

      case 'swipe': $root.innerHTML = SwipeScreen(); break;
      case 'chatList': $root.innerHTML = ChatListScreen(); break;
      case 'chatRoom': $root.innerHTML = ChatRoomScreen(); break;
      case 'premium': $root.innerHTML = PremiumScreen(); break;
      case 'profile': $root.innerHTML = ProfileScreen(); break;
      case 'admin': $root.innerHTML = isAdminUser() ? AdminScreen() : AdminRestrictedScreen(); break;
      default: $root.innerHTML = HomeScreen();
    }
  }
  icons();

  if (state.screen === 'chatRoom') {
    const log = document.getElementById('chat-log');
    if (log) log.scrollTop = log.scrollHeight;
  }

  saveState();
}

function UploadBox(kind, emoji, label, value, mediaType) {
  const uploaded = !!value;
  const showImage = uploaded && mediaType === 'image';
  const showVideo = uploaded && mediaType === 'video';
  return `
  <button type="button" data-action="upload-${kind}"
    class="relative aspect-[3/4] rounded-2xl border-2 border-dashed ${uploaded ? 'border-carthage/50' : 'border-white/15'} bg-card/60 flex flex-col items-center justify-center gap-2 overflow-hidden transition active:scale-[0.97]">

      ? `<img src="${value}" class="absolute inset-0 w-full h-full object-cover" alt="${label}" />
         <div class="absolute inset-0 bg-black/35"></div>
         <div class="relative z-10 w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center shadow-soft">
            <i data-lucide="check" class="w-4 h-4 text-white"></i>
         </div>
         <span class="relative z-10 text-[11px] font-semibold text-white bg-black/40 px-2 py-0.5 rounded-full">Ajouté ✓</span>`
      : showVideo
      ? `<video src="${value}" class="absolute inset-0 w-full h-full object-cover" muted autoplay loop playsinline></video>
         <div class="absolute inset-0 bg-black/40"></div>
         <div class="relative z-10 w-9 h-9 rounded-full bg-carthage/90 flex items-center justify-center shadow-carthage">
            <i data-lucide="play" class="w-4 h-4 text-white" fill="white"></i>
         </div>
         <span class="relative z-10 text-[11px] font-semibold text-white bg-black/40 px-2 py-0.5 rounded-full">Vidéo ajoutée ✓</span>`
      : `<span class="text-2xl">${emoji}</span>
         <span class="text-[11px] font-medium text-white/50 text-center px-3 leading-tight">${label}</span>`
    }
  </button>`;
}

/* =========================================================
   SCREEN 1.5 — ACCUEIL (public feed: posts, photos, videos)
   ========================================================= */

function HomeScreen() {
  const d = state.postDraft;

  return `
  <div class="w-full h-full flex flex-col bg-midnight">
    ${Header()}

    <div class="flex-1 overflow-y-auto px-4 pb-3 space-y-4">

      <div class="bg-card border border-white/10 rounded-2xl p-3.5">
        <div class="flex items-start gap-2.5">
          <div class="w-9 h-9 rounded-full bg-gradient-to-br from-slate-600 to-slate-800 shrink-0 overflow-hidden flex items-center justify-center font-display font-bold text-sm">
            ${state.user.photo ? `<img src="${state.user.photo}" class="w-full h-full object-cover" />` : (state.user.pseudo ? state.user.pseudo[0].toUpperCase() : 'T')}
          </div>
          <textarea id="post-caption" rows="2" placeholder="Quoi de neuf, ${state.user.pseudo || 'toi'} ?"
            class="flex-1 bg-transparent resize-none text-[14px] placeholder-white/30 focus:outline-none pt-1.5">${d.text}</textarea>
        </div>

        ${d.photo ? `
          <div class="relative mt-2 rounded-xl overflow-hidden">
            <img src="${d.photo}" class="w-full max-h-52 object-cover" />
            <button data-action="remove-post-photo" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/60 flex items-center justify-center"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
          </div>` : ''}
        ${d.videoUrl ? `
          <div class="relative mt-2 rounded-xl overflow-hidden">
            <video src="${d.videoUrl}" class="w-full max-h-52 object-cover" muted autoplay loop playsinline></video>
            <button data-action="remove-post-video" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/60 flex items-center justify-center"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
          </div>` : ''}

        <div class="flex items-center justify-between mt-2.5 pt-2.5 border-t border-white/5">
          <div class="flex items-center gap-1.5">
            <button data-action="attach-post-photo" class="flex items-center gap-1.5 text-white/60 text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-white/5">
              <i data-lucide="image" class="w-3.5 h-3.5"></i> Photo
            </button>
            <button data-action="attach-post-video" class="flex items-center gap-1.5 text-white/60 text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-white/5">
              <i data-lucide="video" class="w-3.5 h-3.5"></i> Vidéo
            </button>
          </div>
          <button data-action="publish-post"
            class="px-4 py-1.5 rounded-full text-xs font-bold transition bg-carthage shadow-carthage active:scale-95">
            Publier
          </button>
        </div>
      </div>

      ${state.posts.map(post => FeedPost(post)).join('')}
    </div>

    ${BottomNav('home')}
  </div>
  ${MatchPopup()}

  <input type="file" id="post-file-photo" accept="image/*" class="hidden" />
  <input type="file" id="post-file-video" accept="video/*" class="hidden" />
  `;
}

function FeedPost(post) {
  const isMine = post.authorId === 'me';
  const author = isMine
    ? { name: state.user.pseudo || 'Toi', photo: state.user.photo, origin: state.user.city || '—' }
    : profileById(post.authorId);
  const liked = !!state.postLikes[post.id];
  const likeCount = post.baseLikes + (liked ? 1 : 0);

  return `
  <div class="bg-card border border-white/5 rounded-2xl overflow-hidden">
    <div class="flex items-center gap-2.5 px-3.5 pt-3.5 pb-2.5">
      <div class="w-9 h-9 rounded-full shrink-0 overflow-hidden bg-gradient-to-br from-slate-600 to-slate-800 flex items-center justify-center font-display font-bold text-sm">
        ${author.photo ? `<img src="${author.photo}" class="w-full h-full object-cover" />` : (author.name ? author.name[0].toUpperCase() : '?')}
      </div>
      <div class="min-w-0">
        <p class="text-[13.5px] font-semibold truncate">${author.name} <span class="text-white/30 font-normal">· ${author.origin}</span></p>
        <p class="text-white/35 text-[11px]">${post.time}</p>
      </div>
    </div>

    ${post.caption ? `<p class="px-3.5 pb-2.5 text-[13.5px] text-white/85 leading-relaxed">${post.caption}</p>` : ''}

    ${post.photoUrl
      ? `<img src="${post.photoUrl}" class="w-full max-h-64 object-cover" alt="publication" />`
      : post.type === 'photo'
      ? `<img src="${author.photo}" class="w-full max-h-64 object-cover" alt="publication" />`
      : ''}
    ${post.videoUrl
      ? `<video src="${post.videoUrl}" class="w-full max-h-64 object-cover" controls playsinline></video>`
      : (!post.photoUrl && post.type === 'video')
      ? `
      <div class="relative">
        <img src="${author.photo}" class="w-full max-h-64 object-cover brightness-[0.65]" alt="publication" />
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-12 h-12 rounded-full bg-black/50 backdrop-blur flex items-center justify-center border border-white/30">
            <i data-lucide="play" class="w-5 h-5 text-white" fill="white"></i>
          </div>
        </div>
        <span class="absolute bottom-2 left-2 bg-black/55 backdrop-blur text-[10px] font-semibold px-2 py-1 rounded-full flex items-center gap-1">
          <i data-lucide="video" class="w-3 h-3"></i> Vidéo
        </span>
      </div>` : ''}

    <div class="flex items-center gap-4 px-3.5 py-2.5">
      <button data-action="toggle-post-like" data-id="${post.id}" class="flex items-center gap-1.5 text-[12.5px] font-medium ${liked ? 'text-carthage' : 'text-white/50'}">
        <i data-lucide="heart" class="w-4 h-4" ${liked ? 'fill="currentColor"' : ''}></i> ${likeCount}
      </button>
      <span class="flex items-center gap-1.5 text-[12.5px] font-medium text-white/50">
        <i data-lucide="message-circle" class="w-4 h-4"></i> ${Math.floor(post.baseLikes / 20)}
      </span>
      <span class="flex items-center gap-1.5 text-[12.5px] font-medium text-white/50 ml-auto">
        <i data-lucide="share-2" class="w-4 h-4"></i>
      </span>
    </div>
  </div>`;
}

/* =========================================================
   SCREEN 2 — SWIPE ENGINE
   ========================================================= */

function currentProfile() {
  while (state.currentIndex < state.order.length && isSuspended(state.order[state.currentIndex])) {
    state.currentIndex += 1;
  }
  if (state.currentIndex >= state.order.length) return null;
  return profileById(state.order[state.currentIndex]);
}

function SwipeScreen() {
  const p = currentProfile();

  return `
  <div class="w-full h-full flex flex-col bg-midnight">
    ${Header()}
    ${LiveStoriesStrip()}

    <div id="swipe-stage" class="flex-1 px-5 pb-4 relative">
      ${p ? ProfileCard(p) : EmptyStack()}
    </div>

    ${p ? ActionBar() : ''}
    ${BottomNav('swipe')}
  </div>
  ${MatchPopup()}
  ${LivePaywallSheet()}
  `;
}

function LiveStoriesStrip() {
  const liveProfiles = PROFILES.filter(p => isProfileLive(p.id) && !isSuspended(p.id));
  if (liveProfiles.length === 0) return '';
  return `
  <div class="px-5 pb-3 shrink-0">
    <p class="text-white/40 text-[11px] font-semibold tracking-wide mb-2.5">🔴 En direct depuis le bled et la diaspora</p>
    <div class="flex gap-3.5 overflow-x-auto pb-1">
      ${liveProfiles.map(p => `
        <button data-action="watch-story" data-id="${p.id}" class="flex flex-col items-center gap-1.5 shrink-0 active:scale-95 transition">
          <div class="relative w-16 h-16 rounded-full p-[2.5px] bg-gradient-to-br from-carthage via-gold to-carthage">
            <div class="w-full h-full rounded-full p-[2px] bg-midnight">
              <img src="${p.photo}" alt="${p.name}" class="w-full h-full rounded-full object-cover" />
            </div>
            <span class="absolute -bottom-0.5 left-1/2 -translate-x-1/2 bg-carthage text-[8px] font-bold px-1.5 py-[1px] rounded-full border border-midnight tracking-wide">LIVE</span>
          </div>
          <span class="text-[11px] text-white/70 max-w-[64px] truncate">${p.name}</span>
        </button>
      `).join('')}
    </div>
  </div>`;
}

function EmptyStack() {
  return `
  <div class="w-full h-full rounded-3xl border border-white/10 bg-card flex flex-col items-center justify-center gap-3 text-center px-8">
    <div class="w-14 h-14 rounded-2xl bg-carthage/15 flex items-center justify-center">
      <i data-lucide="map-pinned" class="w-6 h-6 text-carthage"></i>
    </div>
    <p class="font-display font-bold text-lg">Tu as vu tout le monde</p>
    <p class="text-white/50 text-sm">Reviens plus tard, de nouveaux profils du bled et de la diaspora arrivent chaque jour.</p>
  </div>`;
}

function ProfileCard(p) {
  const isWatchingLive = state.cardMode === 'live';
  const live = isProfileLive(p.id);
  const viewers = state.liveViewers[p.id] || (1200 + p.id * 173);

  return `
  <div id="profile-card" class="card-enter relative w-full h-full rounded-3xl overflow-hidden shadow-soft border border-white/10 bg-gradient-to-br ${p.gradient}">

    <img src="${p.photo}" alt="${p.name}" class="absolute inset-0 w-full h-full object-cover ${isWatchingLive ? 'scale-110 blur-md brightness-[0.55]' : ''} transition-all duration-500" />
    <div class="absolute inset-0 bg-gradient-to-br ${p.gradient} mix-blend-color opacity-45"></div>

    ${isWatchingLive ? `
      <div class="absolute inset-0">
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="relative w-32 h-32 flex items-center justify-center">
            <span class="absolute inset-0 rounded-full border-2 border-white/40 live-ring"></span>
            <span class="absolute inset-0 rounded-full border-2 border-white/30 live-ring" style="animation-delay:.7s"></span>
            <img src="${p.photo}" alt="${p.name}" class="w-24 h-24 rounded-full object-cover border-2 border-white/70 shadow-soft" />
          </div>
        </div>
        <div class="absolute top-4 left-4 flex items-center gap-1.5 bg-black/50 backdrop-blur px-2.5 py-1 rounded-full">
          <span class="w-2 h-2 rounded-full bg-carthage live-dot"></span>
          <span class="text-[11px] font-bold tracking-wide">● DIRECT LIVE</span>
        </div>
        <div class="absolute top-4 right-4 flex items-center gap-1 bg-black/50 backdrop-blur px-2.5 py-1 rounded-full text-[11px] font-semibold">
          <i data-lucide="eye" class="w-3 h-3"></i> ${viewers.toLocaleString('fr-FR')}
        </div>
        <button data-action="close-live" class="absolute bottom-28 left-1/2 -translate-x-1/2 bg-black/55 backdrop-blur px-4 py-2 rounded-full text-xs font-semibold flex items-center gap-1.5">
          <i data-lucide="x" class="w-3.5 h-3.5"></i> Fermer le direct
        </button>
      </div>
    ` : ''}

    <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 via-black/50 to-transparent pt-20 pb-5 px-5">
      ${(!isWatchingLive && live) ? `
        <button data-action="watch-live" class="mb-3 inline-flex items-center gap-1.5 bg-carthage/90 backdrop-blur px-3 py-1.5 rounded-full text-xs font-bold shadow-carthage active:scale-95 transition">
          <span class="w-1.5 h-1.5 rounded-full bg-white live-dot"></span> 👁️ Regarder son Live
        </button>` : ''}

      <div class="flex items-end justify-between mb-1.5">
        <h2 class="font-display font-extrabold text-2xl">${p.name}, ${p.age}</h2>
        <span class="text-2xl leading-none">${p.flag}</span>
      </div>
      <div class="flex items-center gap-1.5 text-white/70 text-[13px] mb-2.5">
        <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
        <span>${p.currentCity}, ${p.currentCountry}</span>
        <span class="text-white/30">•</span>
        <span class="inline-flex items-center gap-1 text-gold"><i data-lucide="home" class="w-3.5 h-3.5"></i>Origine : ${p.origin}</span>
      </div>
      <p class="text-white/85 text-[13.5px] leading-relaxed line-clamp-3">${p.bio}</p>
    </div>
  </div>`;
}

function ActionBar() {
  return `
  <div class="px-6 pb-7 pt-1 flex items-center justify-center gap-3.5 shrink-0">
    <button data-action="block" title="Bloquer / Signaler"
      class="w-11 h-11 rounded-full bg-card border border-white/10 flex items-center justify-center active:scale-90 transition text-white/50">
      <i data-lucide="shield-alert" class="w-[18px] h-[18px]"></i>
    </button>
    <button data-action="pass" title="Passer"
      class="w-12 h-12 rounded-full bg-card border border-white/10 flex items-center justify-center active:scale-90 transition text-white/60">
      <i data-lucide="skip-forward" class="w-5 h-5"></i>
    </button>
    <button data-action="dislike" title="Dislike"
      class="w-16 h-16 rounded-full bg-card border border-white/10 flex items-center justify-center active:scale-90 transition text-white/80">
      <i data-lucide="x" class="w-7 h-7"></i>
    </button>
    <button data-action="like" title="Like"
      class="w-16 h-16 rounded-full bg-carthage flex items-center justify-center active:scale-90 transition shadow-carthage">
      <i data-lucide="heart" class="w-7 h-7 text-white" fill="white"></i>
    </button>
  </div>`;
}

/* =========================================================
   MATCH POPUP
   ========================================================= */

function MatchPopup() {
  if (!state.matchPopupOpen || !state.pendingMatchId) return '';
  const p = profileById(state.pendingMatchId);
  return `
  <div class="match-overlay absolute inset-0 z-[60] bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center px-8 text-center">
    <p class="match-heading font-display font-black text-carthage text-4xl mb-1 tracking-tight">C'est un Match !</p>
    <p class="text-white/60 text-sm mb-8">Toi et ${p.name} vous êtes likés</p>

    <div class="flex items-center justify-center mb-9 -space-x-6">
      <div class="match-avatar-left w-24 h-24 rounded-full border-4 border-midnight bg-gradient-to-br from-slate-600 to-slate-800 flex items-center justify-center font-display font-black text-xl shadow-soft overflow-hidden">
        ${state.user.photo ? `<img src="${state.user.photo}" class="w-full h-full object-cover" alt="Toi" />` : 'Toi'}
      </div>
      <div class="match-avatar-right w-24 h-24 rounded-full border-4 border-midnight shadow-soft z-10 overflow-hidden">
        <img src="${p.photo}" class="w-full h-full object-cover" alt="${p.name}" />
      </div>
    </div>

    <button data-action="go-to-chat-from-match" class="w-full max-w-[280px] bg-carthage rounded-2xl py-4 font-display font-bold shadow-carthage active:scale-[0.97] transition flex items-center justify-center gap-2">
      <i data-lucide="send" class="w-4 h-4"></i> Envoyer un Message Privé 💬
    </button>
    <button data-action="close-match-popup" class="mt-4 text-white/40 text-sm font-medium">Continuer à explorer</button>
  </div>`;
}

function LivePaywallSheet() {
  if (!state.livePaywallFor) return '';
  const p = profileById(state.livePaywallFor);
  if (!p) return '';
  const abroad = isAbroad();
  const price = abroad ? formatEUR(state.pricing.liveAbroad) : formatTND(state.pricing.liveTunisia);
  const method = state.paywallMethod || 'recharge';

  return `
  <div class="absolute inset-0 z-[65] bg-black/80 backdrop-blur-sm flex items-end">
    <div class="admin-slide w-full bg-carddeep border-t border-white/10 rounded-t-3xl p-5">
      <div class="flex items-center gap-3 mb-4">
        <img src="${p.photo}" alt="${p.name}" class="w-12 h-12 rounded-full object-cover" />
        <div class="min-w-0">
          <p class="font-display font-bold truncate">${p.name} est en direct</p>
          <p class="text-white/40 text-xs">Live premium — accès payant</p>
        </div>
        <button data-action="close-live-paywall" class="ml-auto w-8 h-8 rounded-full bg-white/5 flex items-center justify-center shrink-0">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="bg-card rounded-2xl p-4 mb-4 flex items-center justify-between">
        <span class="text-sm text-white/70">Prix d'accès (${abroad ? 'étranger' : 'Tunisie'})</span>
        <span class="font-display font-bold text-lg text-carthage">${price}</span>
      </div>

      ${!abroad ? `
        <div class="flex gap-2 mb-3">
          <button data-action="select-paywall-method" data-method="recharge" class="flex-1 py-2.5 rounded-xl text-xs font-semibold transition ${method !== 'card' ? 'bg-carthage text-white' : 'bg-white/5 text-white/50'}">📱 Recharge</button>
          <button data-action="select-paywall-method" data-method="card" class="flex-1 py-2.5 rounded-xl text-xs font-semibold transition ${method === 'card' ? 'bg-carthage text-white' : 'bg-white/5 text-white/50'}">💳 Carte (TND)</button>
        </div>
        ${method !== 'card'
          ? `<input id="paywall-recharge-code" type="text" inputmode="numeric" placeholder="Code de recharge (14 chiffres)" class="w-full bg-card border border-white/10 rounded-xl px-4 py-3 text-sm mb-3 placeholder-white/30" />`
          : `<input id="paywall-card-number" type="text" inputmode="numeric" placeholder="Numéro de carte" class="w-full bg-card border border-white/10 rounded-xl px-4 py-3 text-sm mb-3 placeholder-white/30" />`
        }
      ` : `
        <p class="text-xs text-white/40 mb-3">Paiement par carte bancaire internationale (EUR).</p>
        <input id="paywall-card-number" type="text" inputmode="numeric" placeholder="Numéro de carte" class="w-full bg-card border border-white/10 rounded-xl px-4 py-3 text-sm mb-3 placeholder-white/30" />
      `}

      <button data-action="confirm-live-payment" data-id="${p.id}" class="w-full py-3.5 rounded-2xl bg-carthage font-display font-bold shadow-carthage active:scale-[0.98] transition">
        Payer ${price} et regarder
      </button>
      <p class="text-center text-white/25 text-[11px] mt-3">Ou passe <span data-action="switch-screen" data-screen="premium" class="text-carthage font-semibold">Premium</span> pour un accès illimité aux lives.</p>
    </div>
  </div>`;
}

/* =========================================================
   SCREEN 3 — CHAT LIST
   ========================================================= */

function ChatListScreen() {
  return `
  <div class="w-full h-full flex flex-col bg-midnight">
    ${Header()}
    <h1 class="font-display font-extrabold text-lg px-5 pb-2 shrink-0">Tes matchs</h1>

    <div class="flex-1 overflow-y-auto px-4 pb-4">
      ${state.matches.length === 0 ? `
        <div class="h-full flex flex-col items-center justify-center text-center px-8 gap-3">
          <div class="w-14 h-14 rounded-2xl bg-card flex items-center justify-center">
            <i data-lucide="heart-crack" class="w-6 h-6 text-white/30"></i>
          </div>
          <p class="text-white/50 text-sm">Pas encore de match. Continue à swiper, ta prochaine conversation t'attend !</p>
        </div>
      ` : state.matches.map(id => {
        const p = profileById(id);
        const thread = state.messages[id] || [];
        const last = thread[thread.length - 1];
        const unread = state.unread[id] || 0;
        return `
        <button data-action="open-chat" data-id="${id}" class="w-full flex items-center gap-3 px-2 py-3 rounded-2xl active:bg-white/5 transition">
          <div class="relative w-14 h-14 rounded-full shrink-0 ${isProfileLive(p.id) ? 'p-[2px] bg-gradient-to-br from-carthage via-gold to-carthage' : ''}">
            <img src="${p.photo}" alt="${p.name}" class="w-full h-full rounded-full object-cover ${isProfileLive(p.id) ? 'border-2 border-midnight' : ''}" />
            ${isProfileLive(p.id) ? `<span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 rounded-full bg-carthage border-2 border-midnight live-dot"></span>` : ''}
          </div>
          <div class="flex-1 text-left min-w-0">
            <div class="flex items-center justify-between">
              <p class="font-semibold text-[15px]">${p.name} <span class="text-white/40 font-normal text-xs">· ${p.origin}</span></p>
            </div>
            <p class="text-white/45 text-[13px] truncate max-w-[190px]">${last ? (last.from === 'me' ? 'Toi : ' : '') + last.text : 'Dites bonjour 👋'}</p>
          </div>
          ${unread > 0 ? `<span class="min-w-[20px] h-5 px-1.5 rounded-full bg-carthage text-[11px] font-bold flex items-center justify-center shadow-carthage">${unread}</span>` : ''}
        </button>`;
      }).join('')}
    </div>
    ${BottomNav('chatList')}
  </div>
  `;
}

/* =========================================================
   SCREEN 4 — CHAT ROOM
   ========================================================= */

function ChatRoomScreen() {
  const p = profileById(state.activeChatId);
  const thread = state.messages[p.id] || [];

  return `
  <div class="w-full h-full flex flex-col bg-midnight">
    <header class="flex items-center gap-3 px-4 pt-6 pb-3 shrink-0 border-b border-white/5">
      <button data-action="back-to-chatlist" class="w-9 h-9 rounded-full bg-card border border-white/10 flex items-center justify-center shrink-0">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <div class="relative w-10 h-10 rounded-full shrink-0">
        <img src="${p.photo}" alt="${p.name}" class="w-full h-full rounded-full object-cover" />
        ${isProfileLive(p.id) ? `<span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-carthage border-2 border-midnight live-dot"></span>` : ''}
      </div>
      <div class="min-w-0">
        <p class="font-semibold text-[15px] leading-tight">${p.name}</p>
        <p class="text-white/40 text-[11px] leading-tight">${p.currentCity} · origine ${p.origin}</p>
      </div>
    </header>

    <div id="chat-log" class="flex-1 overflow-y-auto px-4 py-4 space-y-2.5">
      <div class="text-center text-white/30 text-xs py-2">Vous avez matché avec ${p.name} 🎉</div>
      ${thread.map(m => ChatBubble(m)).join('')}
      ${state.typingFor === p.id ? TypingBubble() : ''}
    </div>

    <div class="p-3 border-t border-white/5 flex items-center gap-2 shrink-0">
      <input id="chat-input" type="text" placeholder="Écris ton message..."

        </button>

    ${BottomNav('premium')}
  </div>`;
}

  <div class="space-y-2">
    ${state.blocklist.length === 0 ? `
      <div class="bg-card rounded-2xl p-4 text-center text-white/30 text-sm border border-white/5">
        Aucun signalement pour cette session.
      </div>` : state.blocklist.slice().reverse().map((b, i) => {
        const realIndex = state.blocklist.length - 1 - i;
        return `
        <div class="flex items-center gap-3 bg-card rounded-2xl p-3 border border-white/5">
          <div class="w-9 h-9 rounded-full bg-carthage/15 flex items-center justify-center shrink-0">
            <i data-lucide="user-x" class="w-4 h-4 text-carthage"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-[13.5px] font-medium truncate">${b.name} <span class="text-white/30 font-normal">· ID #${String(b.id).padStart(4, '0')}</span></p>
            <p class="text-white/35 text-[11px]">Signalé à ${b.time}</p>
          </div>
          <button data-action="admin-reinstate" data-index="${realIndex}" class="text-[10px] font-semibold uppercase tracking-wide bg-white/5 text-white/60 px-2 py-1 rounded-full shrink-0">
            Rétablir
          </button>
        </div>`;
      }).join('')}
  </div>`;
}

function PriceField(id, label, value, unit) {
  return `
  <div class="flex items-center justify-between gap-3">
    <span class="text-[13px] text-white/70">${label}</span>
    <div class="flex items-center gap-1.5 shrink-0">
      <input id="${id}" type="number" step="0.001" min="0" value="${value}" class="w-24 bg-carddeep border border-white/10 rounded-lg px-2.5 py-1.5 text-sm text-right" />
      <span class="text-xs text-white/40 w-6">${unit}</span>
    </div>
  </div>`;
}

function AdminPricingTab() {
  const pr = state.pricing;
  return `
  <p class="text-xs font-semibold text-white/50 mb-1">Abonnements Premium</p>
  <div class="bg-card rounded-2xl p-4 border border-white/5 space-y-3.5">
    ${PriceField('price-weekly', 'Hebdomadaire', pr.weekly, 'DT')}
    ${PriceField('price-monthly', 'Mensuel', pr.monthly, 'DT')}
    ${PriceField('price-annual', 'Annuel', pr.annual, 'DT')}
  </div>

  <p class="text-xs font-semibold text-white/50 mb-1">Accès Live payant</p>
  <div class="bg-card rounded-2xl p-4 border border-white/5 space-y-3.5">
    ${PriceField('price-live-tn', 'En Tunisie (recharge / carte)', pr.liveTunisia, 'DT')}
    ${PriceField('price-live-abroad', "À l'étranger (carte bancaire)", pr.liveAbroad, '€')}
  </div>

  <button data-action="save-pricing" class="w-full py-3.5 rounded-2xl bg-carthage font-display font-bold shadow-carthage active:scale-[0.98] transition">
    Enregistrer les tarifs
  </button>
  <p class="text-center text-white/30 text-[11px]">Les nouveaux tarifs s'appliquent immédiatement à toute l'application.</p>
  `;
}

/* =========================================================
   EVENT HANDLERS
   ========================================================= */

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function nextCard() {
  state.cardMode = 'normal';
  state.currentIndex += 1;
}

function triggerMatch(p) {
  state.matches.push(p.id);
  if (!state.messages[p.id]) state.messages[p.id] = [];
  state.pendingMatchId = p.id;
  state.matchPopupOpen = true;
}

function spawnHearts() {
  const stage = document.getElementById('swipe-stage');
  if (!stage) return;
  const emojis = ['❤️', '💕', '💖'];
  for (let i = 0; i < 5; i++) {
    const h = document.createElement('span');
    h.className = 'floating-heart';
    h.textContent = emojis[i % emojis.length];
    const left = 40 + Math.random() * 20;
    h.style.left = `${left}%`;
    h.style.setProperty('--rot', `${(Math.random() * 30 - 15).toFixed(0)}deg`);
    h.style.animationDelay = `${i * 70}ms`;
    stage.appendChild(h);
    setTimeout(() => h.remove(), 1300);
  }
}

function handleLike() {
  const p = currentProfile();
  if (!p) return;
  spawnHearts();
  const card = document.getElementById('profile-card');
  if (card) card.classList.add('card-leave-right');
  setTimeout(() => {
    nextCard();
    if (p.willMatch) {
      triggerMatch(p);
    } else {
      render();
      showToast('Like envoyé 💌', { icon: 'heart', tone: 'default' });
      return;
    }
    render();
  }, 260);
}

function handleDislike() {
  const p = currentProfile();
  if (!p) return;
  const card = document.getElementById('profile-card');
  if (card) card.classList.add('card-leave-left');
  setTimeout(() => { nextCard(); render(); }, 260);
}

function handlePass() {
  const p = currentProfile();
  if (!p) return;
  const card = document.getElementById('profile-card');
  if (card) card.classList.add('card-leave-down');
  setTimeout(() => {
    nextCard();
    render();
    showToast('Profil passé', { icon: 'skip-forward', tone: 'default' });
  }, 220);
}

function handleBlock() {
  const p = currentProfile();
  if (!p) return;
  const time = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  state.blocklist.push({ id: p.id, name: p.name, time });
  const card = document.getElementById('profile-card');
  if (card) card.classList.add('card-leave-down');
  showToast(`${p.name} bloqué et signalé`, { icon: 'shield-alert', tone: 'danger' });
  setTimeout(() => { nextCard(); render(); }, 220);
}

function simulateReply(profileId) {
  state.typingFor = profileId;
  render();
  setTimeout(() => {
    state.typingFor = null;
    state.messages[profileId].push({ from: 'them', text: AUTO_REPLIES[profileId] || "Ravi(e) de te lire ! 😊" });
    if (state.screen !== 'chatRoom' || state.activeChatId !== profileId) {
      state.unread[profileId] = (state.unread[profileId] || 0) + 1;
    }
    render();
  }, 1500);
}

function handleSendMessage() {
  const input = document.getElementById('chat-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const id = state.activeChatId;
  if (!state.messages[id]) state.messages[id] = [];
  state.messages[id].push({ from: 'me', text });
  render();
  simulateReply(id);
}

document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;

  switch (action) {
    case 'enter-app': {
      state.screen = state.hasOnboarded ? 'home' : 'onboarding';
      render();
      break;
    }
    case 'toggle-theme': {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      render();
      break;
    }

    case 'send-admin-code': {
      const input = document.getElementById('input-admin-email');
      const email = input ? input.value.trim() : '';
      if (!email || !email.includes('@') || !email.includes('.')) {
        showToast('Entre une adresse email valide', { icon: 'mail', tone: 'danger' });
        break;
      }
      state.user.email = email;
      state.pendingAdminCode = String(Math.floor(100000 + Math.random() * 900000));
      state.adminCodeSent = true;
      render();
      showToast(`Code envoyé (démo) : ${state.pendingAdminCode}`, { icon: 'mail', tone: 'success', duration: 10000 });
      break;
    }
    case 'verify-admin-code': {
      const input = document.getElementById('input-admin-code');
      const code = input ? input.value.trim() : '';
      if (code && code === state.pendingAdminCode) {
        state.user.adminVerified = true;
        state.adminCodeSent = false;
        state.pendingAdminCode = null;
        render();
        showToast('Email vérifié — accès administrateur débloqué 🛡️', { icon: 'shield-check', tone: 'success' });
      } else {
        showToast('Code incorrect, réessaie', { icon: 'x', tone: 'danger' });
      }
      break;
    }

    case 'start-app': {
      if (state.user.pseudo.trim().length < 2) {
        showToast('Ajoute au moins ton pseudo pour continuer ✍️', { icon: 'user', tone: 'danger' });
        const el = document.getElementById('input-pseudo');
        if (el) el.focus();
        break;
      }
      if (state.user.pseudo.trim().toLowerCase() === ADMIN_PSEUDO && !state.user.adminVerified) {
        showToast('Vérifie ton email avant de continuer 🛡️', { icon: 'shield-alert', tone: 'danger' });
        break;
      }
      if (!state.user.country) state.user.country = COUNTRIES[0];
      if (!state.user.city.trim()) state.user.city = 'Non précisé';
      state.hasOnboarded = true;
      state.screen = 'home';
      render();
      break;
    }
    case 'switch-screen': {
      const dest = target.dataset.screen;
      if (dest !== state.screen) state.previousScreen = state.screen;
      state.screen = dest;
      state.livePaywallFor = null;
      if (dest === 'admin') state.adminTab = 'overview';
      render();
      break;
    }
    case 'upload-photo':
    case 'upload-video': {
      const kind = action.split('-')[1];
      document.getElementById(`file-${kind}`).click();
      break;
    }
    case 'watch-live': {
      const p = currentProfile();
      if (p && !canWatchLiveFree(p.id)) {
        state.livePaywallFor = p.id;
        render();
        break;
      }
      state.cardMode = 'live';
      render();
      break;
    }
    case 'close-live': {
      state.cardMode = 'normal';
      render();
      break;
    }
    case 'watch-story': {
      const id = Number(target.dataset.id);
      if (!canWatchLiveFree(id)) {
        state.screen = 'swipe';
        state.livePaywallFor = id;
        render();
        break;
      }
      const idx = state.order.indexOf(id);
      if (idx !== -1) state.currentIndex = idx;
      state.cardMode = 'live';
      state.screen = 'swipe';
      render();
      break;
    }
    case 'close-live-paywall': {
      state.livePaywallFor = null;
      render();
      break;
    }
    case 'select-paywall-method': {
      state.paywallMethod = target.dataset.method;
      render();
      break;
    }
    case 'confirm-live-payment': {
      const id = Number(target.dataset.id);
      const p = profileById(id);
      state.unlockedLives.push(id);
      state.livePaywallFor = null;
      const idx = state.order.indexOf(id);
      if (idx !== -1) state.currentIndex = idx;
      state.cardMode = 'live';
      state.screen = 'swipe';
      render();
      showToast(`Accès payé — profite du live de ${p.name} 🎉`, { icon: 'check-circle', tone: 'success' });
      break;
    }
    case 'like': handleLike(); break;
    case 'dislike': handleDislike(); break;
    case 'pass': handlePass(); break;
    case 'block': handleBlock(); break;

    case 'close-match-popup': {
      state.matchPopupOpen = false;
      render();
      break;
    }
    case 'go-to-chat-from-match': {
      const id = state.pendingMatchId;
      state.matchPopupOpen = false;
      state.activeChatId = id;
      state.unread[id] = 0;
      state.screen = 'chatRoom';
      render();
      break;
    }

    case 'open-chat': {
      const id = Number(target.dataset.id);
      state.activeChatId = id;
      state.unread[id] = 0;
      state.screen = 'chatRoom';
      render();
      break;
    }
    case 'back-to-chatlist': {
      state.screen = 'chatList';
      render();
      break;
    }
    case 'send-message': handleSendMessage(); break;

    case 'attach-post-photo': {
      document.getElementById('post-file-photo').click();
      break;
    }
    case 'attach-post-video': {
      document.getElementById('post-file-video').click();
      break;
    }
    case 'remove-post-photo': {
      state.postDraft.photo = null;
      render();
      break;
    }
    case 'remove-post-video': {
      state.postDraft.videoUrl = null;
      render();
      break;
    }
    case 'publish-post': {
      const d = state.postDraft;
      if (!d.text.trim() && !d.photo && !d.videoUrl) {
        showToast('Écris un message ou ajoute une photo/vidéo', { icon: 'info' });
        break;
      }
      const type = d.videoUrl ? 'video' : d.photo ? 'photo' : 'text';
      state.posts.unshift({
        id: Date.now(),
        authorId: 'me',
        type,
        caption: d.text.trim(),
        photoUrl: d.photo,
        videoUrl: d.videoUrl,
        time: 'À l\'instant',
        baseLikes: 0,
      });
      state.postDraft = { text: '', photo: null, videoUrl: null };
      render();
      showToast('Publication ajoutée à ton fil ✨', { icon: 'sparkles', tone: 'success' });
      break;
    }
    case 'toggle-post-like': {
      const id = Number(target.dataset.id);
      state.postLikes[id] = !state.postLikes[id];
      render();
      break;
    }

    case 'admin-back': {
      state.screen = state.previousScreen || 'home';
      render();
      break;
    }
    case 'admin-tab': {
      state.adminTab = target.dataset.tab;
      render();
      break;
    }
    case 'admin-toggle-suspend': {
      const id = Number(target.dataset.id);
      const p = profileById(id);
      if (isSuspended(id)) {
        state.suspended = state.suspended.filter(x => x !== id);
        showToast(`${p.name} réactivé`, { icon: 'user-check', tone: 'success' });
      } else {
        state.suspended.push(id);
        showToast(`${p.name} suspendu par la modération`, { icon: 'user-x', tone: 'danger' });
      }
      render();
      break;
    }
    case 'admin-toggle-live': {
      const id = Number(target.dataset.id);
      const p = profileById(id);
      const nowLive = !isProfileLive(id);
      state.liveOverrides[id] = nowLive;
      showToast(nowLive ? `Direct de ${p.name} remis en ligne` : `Direct de ${p.name} coupé`, { icon: 'radio', tone: nowLive ? 'success' : 'danger' });
      render();
      break;
    }
    case 'admin-reinstate': {
      const index = Number(target.dataset.index);
      const entry = state.blocklist[index];
      state.blocklist.splice(index, 1);
      if (entry) {
        state.suspended = state.suspended.filter(x => x !== entry.id);
        showToast(`${entry.name} rétabli`, { icon: 'user-check', tone: 'success' });
      }
      render();
      break;
    }
    case 'save-pricing': {
      const read = (id, fallback) => {
        const el = document.getElementById(id);
        const v = el ? parseFloat(el.value) : NaN;
        return isNaN(v) || v < 0 ? fallback : v;
      };
      state.pricing = {
        weekly: read('price-weekly', state.pricing.weekly),
        monthly: read('price-monthly', state.pricing.monthly),
        annual: read('price-annual', state.pricing.annual),
        liveTunisia: read('price-live-tn', state.pricing.liveTunisia),
        liveAbroad: read('price-live-abroad', state.pricing.liveAbroad),
      };
      render();
      showToast('Tarifs mis à jour', { icon: 'banknote', tone: 'success' });
      break;
    }

    case 'select-plan': {
      state.premiumPlan = target.dataset.plan;
      render();
      break;
    }
    case 'select-payment': {
      state.paymentMethod = target.dataset.method;
      render();
      break;
    }
    case 'confirm-premium-payment': {
      state.user.premium = state.premiumPlan;
      render();
      showToast('Abonnement Premium activé 🎉', { icon: 'gem', tone: 'success' });
      break;
    }
    case 'cancel-premium': {
      state.user.premium = null;
      render();
      showToast('Abonnement annulé', { icon: 'info' });
      break;
    }
    case 'logout-reset': {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      state.screen = 'landing';
      state.hasOnboarded = false;
      state.user = { pseudo: '', country: '', city: '', photo: null, videoUrl: null, premium: null, email: '', adminVerified: false };
      state.adminCodeSent = false;
      state.pendingAdminCode = null;
      state.matches = [];
      state.messages = {};
      state.unread = {};
      state.blocklist = [];
      state.suspended = [];
      state.liveOverrides = {};
      state.currentIndex = 0;
      state.cardMode = 'normal';
      state.unlockedLives = [];
      state.posts = INITIAL_POSTS.slice();
      state.postLikes = {};
      state.postDraft = { text: '', photo: null, videoUrl: null };
      state.matchPopupOpen = false;
      state.pendingMatchId = null;
      render();
      showToast('Session réinitialisée', { icon: 'log-out', tone: 'success' });
      break;
    }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'chat-input') {
    e.preventDefault();
    handleSendMessage();
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'input-pseudo') {
    withPreservedFocus(() => {
      state.user.pseudo = e.target.value;
      if (state.screen === 'onboarding') render();
    });
  }
  if (e.target.id === 'input-city') {
    withPreservedFocus(() => {
      state.user.city = e.target.value;
    });
  }
  if (e.target.id === 'post-caption') {
    withPreservedFocus(() => {
      state.postDraft.text = e.target.value;
    });
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'input-country') {
    state.user.country = e.target.value;
    render();
  }
  if (e.target.id === 'file-photo' && e.target.files[0]) {
    readFileAsDataUrl(e.target.files[0]).then(url => {
      state.user.photo = url;
      render();
    });
  }
  if (e.target.id === 'file-video' && e.target.files[0]) {
    state.user.videoUrl = URL.createObjectURL(e.target.files[0]);
    render();
  }
  if (e.target.id === 'post-file-photo' && e.target.files[0]) {
    readFileAsDataUrl(e.target.files[0]).then(url => {
      state.postDraft.photo = url;
      render();
    });
  }
  if (e.target.id === 'post-file-video' && e.target.files[0]) {
    state.postDraft.videoUrl = URL.createObjectURL(e.target.files[0]);
    render();
  }
});

/* Initial render */
loadState();
render();
</script>
</body>
</html>
